<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernweh — Admin</title>
<style>
/* ============================================================
   FERNWEH SUPPLY CO. — shared styles
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap');

:root {
  --paper: #f5f1e8;
  --paper-dim: #ece5d4;
  --ink: #201d1a;
  --ink-soft: #55504a;
  --rust: #a1462b;
  --rust-dark: #833a24;
  --moss: #57623f;
  --line: #dad3c3;
  --white: #fffdf9;
  --radius: 2px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Work Sans', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .display {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  line-height: 1.15;
  margin: 0;
  letter-spacing: -0.01em;
}

a { color: inherit; }

button {
  font-family: 'Work Sans', sans-serif;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--rust);
  outline-offset: 2px;
}

/* ---------- header ---------- */

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 40px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--paper);
  z-index: 20;
}

.site-header .wordmark {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-decoration: none;
}

.site-header .wordmark span {
  color: var(--rust);
}

.cart-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: 1px solid var(--ink);
  padding: 9px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  transition: background 0.15s ease, color 0.15s ease;
}

.cart-toggle:hover { background: var(--ink); color: var(--white); }

.cart-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--rust);
  color: var(--white);
  font-size: 12px;
  font-weight: 600;
}

/* ---------- hero ---------- */

.hero {
  padding: 72px 40px 56px;
  max-width: 640px;
}

.hero .eyebrow {
  color: var(--moss);
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 14px;
}

.hero h1 {
  font-size: clamp(36px, 5vw, 54px);
}

.hero p {
  margin-top: 18px;
  color: var(--ink-soft);
  font-size: 17px;
  max-width: 46ch;
}

/* ---------- product grid ---------- */

.catalog {
  padding: 0 40px 100px;
  max-width: 1240px;
  margin: 0 auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 36px 28px;
}

.card {
  display: flex;
  flex-direction: column;
}

.card .thumb {
  position: relative;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: var(--paper-dim);
  margin-bottom: 14px;
}

.card .thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}

.card:hover .thumb img { transform: scale(1.035); }

.card .tag {
  position: absolute;
  top: 12px;
  left: 12px;
  background: var(--white);
  color: var(--moss);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 9px;
  border-radius: var(--radius);
}

.card h3 {
  font-size: 18px;
  margin-bottom: 4px;
}

.card .desc {
  color: var(--ink-soft);
  font-size: 14px;
  margin-bottom: 8px;
}

.card .price {
  font-weight: 600;
  margin-bottom: 14px;
}

.card .select-btn {
  background: none;
  border: 1px solid var(--ink);
  padding: 10px 0;
  font-size: 14px;
  font-weight: 500;
  border-radius: var(--radius);
  transition: background 0.15s ease, color 0.15s ease;
}

.card .select-btn:hover { background: var(--ink); color: var(--white); }

/* ---------- modal (size/qty picker) ---------- */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(32, 29, 26, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 40;
  padding: 20px;
}

.overlay.open { display: flex; }

.modal {
  background: var(--white);
  width: 100%;
  max-width: 480px;
  border-radius: var(--radius);
  padding: 32px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-top {
  display: flex;
  gap: 20px;
  margin-bottom: 22px;
}

.modal-top img {
  width: 96px;
  height: 120px;
  object-fit: cover;
  background: var(--paper-dim);
}

.modal-top h3 { font-size: 20px; margin-bottom: 4px; }
.modal-top .price { font-weight: 600; color: var(--rust-dark); }

.field-label {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  margin-bottom: 10px;
  display: block;
}

.size-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}

.size-opt {
  border: 1px solid var(--line);
  background: var(--white);
  padding: 8px 14px;
  border-radius: var(--radius);
  font-size: 14px;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.size-opt.active {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--white);
}

.qty-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 26px;
}

.qty-stepper {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.qty-stepper button {
  background: none;
  border: none;
  width: 36px;
  height: 36px;
  font-size: 16px;
}

.qty-stepper span {
  min-width: 30px;
  text-align: center;
  font-weight: 500;
}

.add-to-cart-btn, .primary-btn {
  width: 100%;
  background: var(--rust);
  color: var(--white);
  border: none;
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--radius);
  transition: background 0.15s ease;
}

.add-to-cart-btn:hover, .primary-btn:hover { background: var(--rust-dark); }

.add-to-cart-btn:disabled {
  background: var(--line);
  color: var(--ink-soft);
  cursor: not-allowed;
}

.modal-close {
  position: absolute;
  top: 18px;
  right: 18px;
  background: none;
  border: none;
  font-size: 20px;
  color: var(--ink-soft);
}

/* ---------- cart drawer ---------- */

.drawer {
  position: fixed;
  top: 0;
  right: -420px;
  width: 100%;
  max-width: 420px;
  height: 100%;
  background: var(--white);
  z-index: 50;
  transition: right 0.28s ease;
  display: flex;
  flex-direction: column;
  box-shadow: -8px 0 30px rgba(0,0,0,0.08);
}

.drawer.open { right: 0; }

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 26px;
  border-bottom: 1px solid var(--line);
}

.drawer-header h2 { font-size: 20px; }

.drawer-items {
  flex: 1;
  overflow-y: auto;
  padding: 10px 26px;
}

.drawer-item {
  display: flex;
  gap: 14px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}

.drawer-item img {
  width: 64px;
  height: 80px;
  object-fit: cover;
  background: var(--paper-dim);
  flex-shrink: 0;
}

.drawer-item .meta { flex: 1; }
.drawer-item .meta h4 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.drawer-item .meta .variant { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }

.drawer-item .line-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.drawer-item .qty-stepper button { width: 28px; height: 28px; font-size: 14px; }

.remove-link {
  background: none;
  border: none;
  font-size: 13px;
  color: var(--ink-soft);
  text-decoration: underline;
}

.empty-cart {
  padding: 60px 26px;
  text-align: center;
  color: var(--ink-soft);
}

.drawer-footer {
  padding: 22px 26px 26px;
  border-top: 1px solid var(--line);
}

.subtotal-row {
  display: flex;
  justify-content: space-between;
  font-weight: 600;
  margin-bottom: 16px;
  font-size: 17px;
}

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(32,29,26,0.35);
  z-index: 45;
  display: none;
}

.scrim.open { display: block; }

/* ---------- checkout ---------- */

.checkout-view { padding: 40px; max-width: 560px; margin: 0 auto 100px; }

.checkout-view h2 { font-size: 28px; margin-bottom: 8px; }
.checkout-view .sub { color: var(--ink-soft); margin-bottom: 32px; }

.form-row { margin-bottom: 18px; }
.form-row label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--ink-soft);
}

.form-row input, .form-row textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 15px;
  background: var(--white);
}

.form-row input:focus, .form-row textarea:focus {
  border-color: var(--ink);
  outline: none;
}

.form-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.order-summary {
  background: var(--paper-dim);
  padding: 20px;
  border-radius: var(--radius);
  margin-bottom: 26px;
}

.order-summary .row {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  padding: 6px 0;
}

.order-summary .total-row {
  font-weight: 700;
  font-size: 17px;
  border-top: 1px solid var(--line);
  margin-top: 8px;
  padding-top: 12px;
}

.confirm-banner {
  background: var(--moss);
  color: var(--white);
  padding: 40px;
  border-radius: var(--radius);
  text-align: center;
}

.confirm-banner h2 { color: var(--white); margin-bottom: 10px; }
.confirm-banner p { opacity: 0.9; }

.note-banner {
  font-size: 13px;
  color: var(--ink-soft);
  background: var(--paper-dim);
  padding: 12px 16px;
  border-radius: var(--radius);
  margin-bottom: 24px;
}

/* ---------- admin ---------- */

.admin-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 40px;
  border-bottom: 1px solid var(--line);
}

.admin-shell { max-width: 1200px; margin: 0 auto; padding: 0 40px 80px; }

.login-shell {
  max-width: 360px;
  margin: 100px auto;
  padding: 0 20px;
}

.login-shell h1 { font-size: 26px; margin-bottom: 8px; }
.login-shell .sub { color: var(--ink-soft); margin-bottom: 28px; font-size: 14px; }

.error-msg {
  color: var(--rust-dark);
  font-size: 13px;
  margin-top: 10px;
  display: none;
}

.error-msg.show { display: block; }

.tabs {
  display: flex;
  gap: 4px;
  margin: 28px 0 24px;
  border-bottom: 1px solid var(--line);
}

.tab-btn {
  background: none;
  border: none;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink-soft);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}

.tab-btn.active {
  color: var(--ink);
  border-bottom-color: var(--rust);
  font-weight: 600;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.toolbar .count {
  color: var(--ink-soft);
  font-size: 14px;
}

.stat-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 8px;
}

.stat-card {
  background: var(--white);
  border: 1px solid var(--line);
  padding: 20px;
  border-radius: var(--radius);
}

.stat-card .num {
  font-family: 'Fraunces', serif;
  font-size: 30px;
  margin-bottom: 4px;
}

.stat-card .label {
  font-size: 13px;
  color: var(--ink-soft);
}

table.orders-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
  font-size: 14px;
}

.orders-table th {
  text-align: left;
  padding: 12px 14px;
  border-bottom: 1px solid var(--ink);
  font-weight: 600;
  font-size: 13px;
  color: var(--ink-soft);
  white-space: nowrap;
}

.orders-table td {
  padding: 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

.orders-table tr.order-row { cursor: pointer; }
.orders-table tr.order-row:hover { background: var(--paper-dim); }

.orders-table .items-detail-row td {
  background: var(--paper-dim);
  display: none;
}

.orders-table .items-detail-row.open td { display: table-cell; }

.item-line {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  max-width: 480px;
}

.status-pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--paper-dim);
  color: var(--moss);
}

.download-btn {
  background: var(--ink);
  color: var(--white);
  border: none;
  padding: 11px 20px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
}

.download-btn:hover { background: var(--rust-dark); }

.logout-link {
  background: none;
  border: none;
  font-size: 14px;
  color: var(--ink-soft);
  text-decoration: underline;
}

.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--white);
  border: 1px solid var(--line);
  padding: 16px 20px;
  border-radius: var(--radius);
  margin: 28px 0 4px;
  flex-wrap: wrap;
  gap: 12px;
}

.status-open { color: var(--moss); }
.status-closed { color: var(--rust-dark); }

.danger-btn, .success-btn {
  border: none;
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  color: var(--white);
}

.danger-btn { background: var(--rust); }
.danger-btn:hover { background: var(--rust-dark); }
.success-btn { background: var(--moss); }
.success-btn:hover { background: #454e33; }

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-soft);
}

.loading-msg { padding: 40px 0; color: var(--ink-soft); font-size: 14px; }

@media (max-width: 640px) {
  .site-header, .catalog, .hero, .admin-header, .admin-shell { padding-left: 20px; padding-right: 20px; }
  .form-grid-2 { grid-template-columns: 1fr; }
  .drawer { max-width: 100%; }
}

</style>
</head>
<body>

<!-- Login screen -->
<div class="login-shell" id="loginShell">
  <h1>Admin login</h1>
  <p class="sub">Sign in with the account you created in Firebase Authentication.</p>
  <form id="loginForm">
    <div class="form-row">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" required>
    </div>
    <div class="form-row">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" required>
    </div>
    <button class="primary-btn" type="submit">Log in</button>
    <div class="error-msg" id="loginError"></div>
  </form>
</div>

<!-- Admin dashboard (shown after login) -->
<div id="dashboard" style="display:none;">
  <header class="admin-header">
    <a href="admin.html" class="wordmark">Fernweh<span>.</span> Admin</a>
    <button class="logout-link" id="logoutBtn">Log out</button>
  </header>

  <div class="admin-shell">
    <div class="status-bar">
      <div><strong>Store status:</strong> <span id="statusLabel">Loading...</span></div>
      <button id="toggleStoreBtn" type="button">...</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="orders">Orders</button>
      <button class="tab-btn" data-tab="summary">Summary</button>
    </div>

    <!-- Orders tab -->
    <div class="tab-panel active" id="tab-orders">
      <div class="toolbar">
        <span class="count" id="orderCount">Loading orders...</span>
        <button class="download-btn" id="downloadCsvBtn">Download all as CSV</button>
      </div>
      <div id="ordersTableWrap"></div>
    </div>

    <!-- Summary tab -->
    <div class="tab-panel" id="tab-summary">
      <div class="stat-cards" id="statCards"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ============================================================
   FIREBASE CONFIG
   ------------------------------------------------------------
   This is the ONLY setup step. You are not writing code here —
   you are pasting a block of keys that Firebase generates for
   you automatically. Steps:

   1. Go to https://console.firebase.google.com
   2. Click "Add project" and give it any name (e.g. my-store)
   3. Once created, click the "</>" (web) icon to register a web app
   4. Firebase will show you a block that looks just like the
      object below, but filled in with real values. Copy those
      real values and paste them in below, replacing the
      placeholder text (keep the quote marks). Paste the SAME
      values into the matching spot near the top of index.html
      too — both files need the same keys.
   5. In the left sidebar, go to Build > Firestore Database >
      Create database. Choose "Start in production mode" and
      any location close to you.
   6. In Firestore, click the "Rules" tab and replace the rules
      with the contents of firestore.rules.txt in this folder,
      then click "Publish". (This lets customers submit orders,
      but only logged-in admins can read them back.)
   7. In the left sidebar, go to Build > Authentication > Get
      started > Sign-in method > enable "Email/Password".
   8. Still in Authentication, go to the "Users" tab > "Add
      user" and create yourself a login (any email + password)
      — this is what you'll use to log into admin.html.

   That's it. No further code changes needed.
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyCyLhrsu2CugfGG01JULn224xWplhnSWnM",
  authDomain: "duncan-apparel.firebaseapp.com",
  projectId: "duncan-apparel",
  storageBucket: "duncan-apparel.firebasestorage.app",
  messagingSenderId: "37950482266",
  appId: "1:37950482266:web:32c7017e02cfbbb113f563"
};

</script>
<script>
/* ============================================================
   FERNWEH SUPPLY CO. — admin logic
   You shouldn't need to edit this file.
   ============================================================ */

let auth, db;
let ordersCache = [];

if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE_")) {
  document.getElementById("loginShell").innerHTML =
    `<h1>Setup needed</h1><p class="sub">Firebase isn't configured yet. Open this file's code and follow the FIREBASE CONFIG setup steps near the top first.</p>`;
} else {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();

  const loginShell = document.getElementById("loginShell");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    loginError.classList.remove("show");
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    auth.signInWithEmailAndPassword(email, password).catch(err => {
      loginError.textContent = "Couldn't log in: " + err.message;
      loginError.classList.add("show");
    });
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    auth.signOut();
  });

  auth.onAuthStateChanged((user) => {
    if (user) {
      loginShell.style.display = "none";
      dashboard.style.display = "block";
      loadOrders();
      initStoreStatus();
    } else {
      loginShell.style.display = "block";
      dashboard.style.display = "none";
    }
  });
}

// ---------- Store open/closed toggle ----------
function initStoreStatus() {
  const statusLabel = document.getElementById("statusLabel");
  const toggleBtn = document.getElementById("toggleStoreBtn");
  const settingsRef = db.collection("settings").doc("store");

  settingsRef.onSnapshot((doc) => {
    const isOpen = !doc.exists || doc.data().storeOpen !== false;

    if (isOpen) {
      statusLabel.textContent = "Open — accepting orders";
      statusLabel.className = "status-open";
      toggleBtn.textContent = "Close store";
      toggleBtn.className = "danger-btn";
    } else {
      statusLabel.textContent = "Closed — not accepting orders";
      statusLabel.className = "status-closed";
      toggleBtn.textContent = "Reopen store";
      toggleBtn.className = "success-btn";
    }

    toggleBtn.onclick = () => {
      toggleBtn.disabled = true;
      settingsRef.set({ storeOpen: !isOpen }, { merge: true })
        .finally(() => { toggleBtn.disabled = false; });
    };
  }, (err) => {
    statusLabel.textContent = "Couldn't load status";
  });
}

// ---------- Tabs ----------
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

// ---------- Load + render orders ----------
function loadOrders() {
  document.getElementById("ordersTableWrap").innerHTML = `<div class="loading-msg">Loading orders...</div>`;

  db.collection("orders").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
    ordersCache = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderOrdersTable();
    renderSummary();
  }, (err) => {
    document.getElementById("ordersTableWrap").innerHTML =
      `<div class="empty-state">Couldn't load orders: ${err.message}</div>`;
  });
}

function formatDate(ts) {
  if (!ts) return "-";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) +
    " " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function money(n) {
  return "$" + Number(n || 0).toFixed(2).replace(/\.00$/, "");
}

function renderOrdersTable() {
  const wrap = document.getElementById("ordersTableWrap");
  const countEl = document.getElementById("orderCount");
  countEl.textContent = ordersCache.length + (ordersCache.length === 1 ? " order" : " orders");

  if (ordersCache.length === 0) {
    wrap.innerHTML = `<div class="empty-state">No orders yet. Once a customer checks out, it'll show up here.</div>`;
    return;
  }

  const rows = ordersCache.map(o => {
    const itemsSummary = (o.items || []).map(i => `${i.name} (${i.size}) x${i.qty}`).join(", ");
    const itemsDetail = (o.items || []).map(i =>
      `<div class="item-line"><span>${i.name} &middot; size ${i.size} &middot; qty ${i.qty}</span><span>${money(i.price * i.qty)}</span></div>`
    ).join("");

    return `
      <tr class="order-row" data-id="${o.id}">
        <td>${formatDate(o.createdAt)}</td>
        <td>${o.firstName || ""} ${o.lastName || ""}<br><span style="color:var(--ink-soft); font-size:13px;">${o.email || ""}</span></td>
        <td>${itemsSummary}</td>
        <td>${o.itemCount || 0}</td>
        <td>${money(o.total)}</td>
        <td><span class="status-pill">${o.status || "New"}</span></td>
      </tr>
      <tr class="items-detail-row" id="detail-${o.id}">
        <td colspan="6">
          <strong>Shipping address</strong><div>${(o.address || "").replace(/\n/g, "<br>")}</div>
          ${o.phone ? `<div style="margin-top:6px;"><strong>Phone</strong> ${o.phone}</div>` : ""}
          ${o.note ? `<div style="margin-top:6px;"><strong>Notes</strong> ${o.note}</div>` : ""}
          <div style="margin-top:12px;"><strong>Items</strong>${itemsDetail}</div>
        </td>
      </tr>
    `;
  }).join("");

  wrap.innerHTML = `
    <table class="orders-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Customer</th>
          <th>Items</th>
          <th># items</th>
          <th>Total</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  wrap.querySelectorAll(".order-row").forEach(row => {
    row.addEventListener("click", () => {
      document.getElementById("detail-" + row.dataset.id).classList.toggle("open");
    });
  });
}

function renderSummary() {
  const totalOrders = ordersCache.length;
  const totalRevenue = ordersCache.reduce((s, o) => s + Number(o.total || 0), 0);
  const totalItems = ordersCache.reduce((s, o) => s + Number(o.itemCount || 0), 0);
  const avgOrder = totalOrders ? totalRevenue / totalOrders : 0;

  document.getElementById("statCards").innerHTML = `
    <div class="stat-card"><div class="num">${totalOrders}</div><div class="label">Total orders</div></div>
    <div class="stat-card"><div class="num">${money(totalRevenue)}</div><div class="label">Total order value</div></div>
    <div class="stat-card"><div class="num">${totalItems}</div><div class="label">Items ordered</div></div>
    <div class="stat-card"><div class="num">${money(avgOrder)}</div><div class="label">Average order value</div></div>
  `;
}

// ---------- CSV export ----------
function csvEscape(val) {
  const str = String(val === undefined || val === null ? "" : val);
  if (/[",\n]/.test(str)) {
    return `"${str.replace(/"/g, '""')}"`;
  }
  return str;
}

document.getElementById("downloadCsvBtn").addEventListener("click", () => {
  if (ordersCache.length === 0) {
    alert("No orders to download yet.");
    return;
  }

  const header = [
    "Order ID", "Date", "First name", "Last name", "Email", "Phone",
    "Address", "Notes", "Items", "Item count", "Total", "Status"
  ];

  const rows = ordersCache.map(o => [
    o.id,
    formatDate(o.createdAt),
    o.firstName,
    o.lastName,
    o.email,
    o.phone,
    o.address,
    o.note,
    (o.items || []).map(i => `${i.name} (${i.size}) x${i.qty}`).join("; "),
    o.itemCount,
    o.total,
    o.status
  ]);

  const csv = [header, ...rows].map(r => r.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `fernweh-orders-${stamp}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

</script>
</body>
</html>
